<div class="card-lista">
  <h2>Productos Registrados ({{ productos().length }})</h2>

  <p *ngIf="productos().length === 0" class="vacio">No hay elementos agregados aún.</p>

  <div class="grid-items">
    <div *ngFor="let item of productos()" class="item-card">
      <div class="item-header">
        <h3>{{ item.nombre }}</h3>
        <span class="badge">{{ item.categoria }}</span>
      </div>
      <p class="desc">{{ item.descripcion || 'Sin descripción' }}</p>
      <div class="details">
        <span><strong>Precio:</strong> ${{ item.precio }}</span>
        <span><strong>Stock:</strong> {{ item.stock }} uds.</span>
      </div>
      <div class="acciones">
        <button (click)="editar(item)" class="btn-editar">Editar</button>
        <button (click)="eliminar(item.id)" class="btn-eliminar">Eliminar</button>
      </div>
    </div>
  </div>
</div>
