<div class="container">
  <app-header></app-header>

  <div class="layout">
    <app-formulario
      [productoAEditar]="productoAEditar()"
      (guardarProductoEvent)="guardarProducto($event)"
      (cancelarEdicionEvent)="cancelarEdicion()">
    </app-formulario>

    <app-lista-productos
      [productos]="productos()"
      (editarEvent)="seleccionarParaEditar($event)"
      (eliminarEvent)="eliminarProducto($event)">
    </app-lista-productos>
  </div>
</div>
